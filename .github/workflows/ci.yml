name: CI

on:
  push:
    branches:
      - main
      - Group-C-feature/auth-module-deepa

  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contractiq_test
          POSTGRES_PASSWORD: contractiq_test_password
          POSTGRES_DB: contractiq_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U contractiq_test -d contractiq_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://contractiq_test:contractiq_test_password@localhost:5432/contractiq_test_db
      SECRET_KEY: github-actions-test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-dev.txt

      - name: Verify PostgreSQL connection
        run: |
          python -c "import os, psycopg2; connection = psycopg2.connect(os.environ['DATABASE_URL']); print('PostgreSQL connected'); connection.close()"

      - name: Run server tests
        run: |
          cd server
          python -m pytest -q
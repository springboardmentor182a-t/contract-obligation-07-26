name: CI

on:
  push:
    branches:
      - main
      - Group-C-feature/auth-module-deepa

  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contractiq_test
          POSTGRES_PASSWORD: contractiq_test_password
          POSTGRES_DB: contractiq_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U contractiq_test -d contractiq_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://contractiq_test:contractiq_test_password@localhost:5432/contractiq_test_db' }}
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'github-actions-test-secret-key' }}
      ALGORITHM: ${{ secrets.ALGORITHM || 'HS256' }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES || '30' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-dev.txt

      - name: Verify environment
        run: |
          python -c "import os; print('DATABASE_URL configured:', bool(os.getenv('DATABASE_URL')))"

      - name: Run server tests
        run: |
          cd server
          python -m pytest -q

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: contract_iq_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "siree@3"
      POSTGRES_DB: contract_iq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: contract_iq_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:siree%403@db:5432/contract_iq
      - ALLOWED_ORIGINS=["http://localhost","http://localhost:5173","http://127.0.0.1:5173","http://localhost:80"]
      - DISABLE_CHATBOT_MODEL=true
    env_file:
      - ./Server/.env
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: contract_iq_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

services:

  # =========================
  # PostgreSQL Database
  # =========================
  db:
    image: postgres:16-alpine
    container_name: contractiq-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: contract_iq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contract_iq"]
      interval: 5s
      timeout: 5s
      retries: 10


  # =========================
  # FastAPI Backend
  # =========================
  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile

    container_name: contractiq-backend
    restart: unless-stopped

    env_file:
      - ./Server/.env

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/contract_iq

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - uploads_data:/app/uploads
      - vector_data:/app/vector_db

    ports:
      - "8000:8000"


  # =========================
  # React Frontend + Nginx
  # =========================
  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile

    container_name: contractiq-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"


# =========================
# Persistent Volumes
# =========================
volumes:
  postgres_data:
  uploads_data:
  vector_data: